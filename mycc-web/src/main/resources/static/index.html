<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>mycc</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; display: flex; height: 100vh; }
  #sidebar { width: 240px; border-right: 1px solid #ddd; display: flex; flex-direction: column; background: #fafafa; }
  #new { margin: 10px; padding: 8px; cursor: pointer; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #list li { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list li.active { background: #e6f0ff; }
  #list li .del { float: right; color: #c00; visibility: hidden; }
  #list li:hover .del { visibility: visible; }
  main { flex: 1; display: flex; flex-direction: column; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
  .user { color: #0a6; }
  .thinking { color: #999; font-style: italic; }
  .tool { color: #a80; font-family: monospace; }
  .result { color: #2a2; font-family: monospace; }
  .error { color: #c00; }
  #composer { display: flex; border-top: 1px solid #ddd; padding: 10px; }
  #input { flex: 1; padding: 8px; font: inherit; }
  #send { padding: 8px 16px; }
</style>
</head>
<body>
<aside id="sidebar">
  <button id="new">＋ 新建会话</button>
  <ul id="list"></ul>
</aside>
<main>
  <div id="messages"></div>
  <form id="composer">
    <input id="input" placeholder="输入消息…" autocomplete="off" />
    <button id="send" type="submit">发送</button>
  </form>
</main>
<script>
let currentId = null;
let es = null;
let currentTurn = null;   // 当前 assistant 气泡

const listEl = document.getElementById('list');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');

async function loadSessions() {
  const sessions = await (await fetch('/v1/sessions')).json();
  listEl.innerHTML = '';
  for (const s of sessions) {
    const li = document.createElement('li');
    li.textContent = (s.title || s.id) + '  ';
    li.dataset.id = s.id;
    if (s.id === currentId) li.classList.add('active');
    li.onclick = () => select(s.id);
    const del = document.createElement('span');
    del.className = 'del';
    del.textContent = '✕';
    del.title = '删除';
    del.onclick = async (e) => {
      e.stopPropagation();
      await fetch('/v1/sessions/' + s.id, { method: 'DELETE' });
      if (s.id === currentId) { currentId = null; messagesEl.innerHTML = ''; if (es) es.close(); }
      loadSessions();
    };
    li.appendChild(del);
    listEl.appendChild(li);
  }
}

async function newSession() {
  const { id } = await (await fetch('/v1/sessions', { method: 'POST' })).json();
  await loadSessions();
  select(id);
}

function line(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function select(id) {
  currentId = id;
  currentTurn = null;
  if (es) es.close();
  messagesEl.innerHTML = '';
  // 历史消息
  const history = await (await fetch('/v1/sessions/' + id)).json();
  for (const m of history) {
    if (m.role === 'USER') line('user', '我 > ' + m.content);
    else if (m.role === 'ASSISTANT' && m.content) line('', m.content);
    else if (m.role === 'TOOL') line('result', '[结果] ' + m.content);
  }
  // 实时事件
  es = new EventSource('/v1/sessions/' + id + '/events');
  es.onmessage = (e) => handleEvent(JSON.parse(e.data));
  loadSessions();
}

function handleEvent(ev) {
  const payload = ev.payload == null ? '' : ev.payload;
  switch (ev.type) {
    case 'USER': currentTurn = null; line('user', '我 > ' + payload); break;
    case 'THINKING':
      if (!currentTurn) currentTurn = line('thinking', '');
      currentTurn.className = 'msg thinking';
      currentTurn.textContent += payload;
      break;
    case 'TOKEN':
      if (!currentTurn) currentTurn = line('', '');
      currentTurn.className = 'msg';
      currentTurn.textContent += payload;
      break;
    case 'TOOL_CALL': currentTurn = null; line('tool', '[工具] ' + payload); break;
    case 'TOOL_RESULT': currentTurn = null; line('result', '[结果] ' + payload); break;
    case 'ERROR': line('error', '[错误] ' + payload); break;
    case 'DONE': currentTurn = null; break;
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

document.getElementById('new').onclick = newSession;
document.getElementById('composer').onsubmit = async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || !currentId) return;
  inputEl.value = '';
  currentTurn = null;
  await fetch('/v1/sessions/' + currentId + '/message', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: text,
  });
  loadSessions();
};

loadSessions();
</script>
</body>
</html>
